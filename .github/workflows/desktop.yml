name: Desktop builds
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
        if: runner.os == 'Linux'
      - run: npm run dist:win
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: wishtube-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
      # Publishing a GitHub Release is what the in-app update checker looks for.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.AppImage
            dist/*.exe
